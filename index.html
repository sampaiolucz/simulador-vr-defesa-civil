<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Simulador VR — Defesa Civil</title>
    <meta name="theme-color" content="#0b1630" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <style>
      :root {
        --navy: #0b1630;
        --navy-2: #12224a;
        --text: #e5e7eb;
        --muted: #a3b1c9;
        --orange: #f97316;
        --blue: #1d4ed8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--text); font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
      #app canvas { display: block; touch-action: none; }

      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
        background: radial-gradient(ellipse at 50% 30%, rgba(11, 22, 48, 0.35), rgba(5, 10, 26, 0.9) 75%);
      }
      #overlay.hidden, .hidden { display: none !important; }
      .card {
        position: relative; width: 100%; max-width: 560px; background: rgba(11, 22, 48, 0.93);
        border: 2px solid rgba(249, 115, 22, 0.9); border-radius: 24px; padding: 30px 28px 24px; text-align: center;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55); overflow: hidden;
      }
      /* faixa zebrada laranja/azul no topo do cartão */
      .card::before {
        content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px;
        background: repeating-linear-gradient(135deg, var(--orange) 0 18px, var(--blue) 18px 36px);
      }
      #logo { width: 112px; height: 112px; margin: 6px auto 4px; display: block; filter: drop-shadow(0 6px 18px rgba(249, 115, 22, 0.35)); }
      .tag { display: block; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); font-weight: 800; margin-top: 8px; }
      h1 { margin: 6px 0 2px; font-size: 30px; line-height: 1.15; }
      h2 { margin: 0 0 10px; font-size: 18px; font-weight: 600; color: var(--muted); }
      p { color: var(--muted); line-height: 1.5; margin: 8px 0; }
      #status { min-height: 1.5em; color: var(--text); font-size: 15px; }
      .buttons { display: grid; gap: 12px; margin-top: 18px; }
      button {
        font: inherit; font-size: 18px; font-weight: 800; padding: 16px 18px; border-radius: 14px; border: 0; cursor: pointer;
        color: #fff; background: linear-gradient(180deg, #fb8a3c, #ea580c); box-shadow: 0 6px 18px rgba(234, 88, 12, 0.35);
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button.secondary { background: var(--navy-2); border: 2px solid #2c3f6e; box-shadow: none; }
      button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
      .scenes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0 4px; }
      .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: #12224a; color: var(--muted); border: 1px solid #2c3f6e; }
      .chip.on { color: #fff; border-color: var(--orange); background: rgba(249, 115, 22, 0.18); }
      #offline { font-size: 13px; margin-top: 14px; }
      #offline.ok { color: #4ade80; }
      #help {
        position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 32px);
        background: rgba(11, 22, 48, 0.88); border: 1px solid #2c3f6e; padding: 8px 14px; border-radius: 10px; font-size: 13px; color: var(--muted);
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center;
      }
      #help kbd { background: #2c3f6e; color: #fff; border-radius: 4px; padding: 1px 6px; font-family: inherit; }
      #btn-menu { font-size: 13px; padding: 6px 10px; border-radius: 8px; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <div class="card">
        <img id="logo" alt="Logo da Defesa Civil" />
        <span class="tag">Defesa Civil de Cubatão</span>
        <h1>Simulador de Emergências</h1>
        <h2>Treinamento em realidade virtual</h2>
        <div class="scenes" id="scene-chips"></div>
        <p id="status">Verificando suporte a VR…</p>
        <div class="buttons">
          <button id="btn-vr" disabled>Entrar no VR</button>
          <button id="btn-desktop" class="secondary">Testar no computador</button>
          <button id="btn-restart" class="secondary hidden">Voltar ao menu de cenas</button>
        </div>
        <p id="offline">Verificando modo offline…</p>
      </div>
    </div>

    <div id="help" class="hidden">
      <span>Arraste para olhar</span>
      <span>Clique para selecionar</span>
      <span><kbd>C</kbd> abaixar/levantar</span>
      <span><kbd>R</kbd> reiniciar cena</span>
      <span><kbd>M</kbd> menu de cenas</span>
      <button id="btn-menu" class="secondary">Menu</button>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
